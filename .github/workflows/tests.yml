name: Fintoran CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile check
        run: python -m compileall -q .
      - name: Tests
        run: pytest -q
      - name: Dependency-light smoke test
        run: python scripts/smoke_test.py
      - name: Master prompt audit
        run: python scripts/master_prompt_audit.py
      - name: Evaluation manifest
        run: python evals/run.py

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t fintoran:ci .
      - name: Start container
        run: |
          docker run -d --name fintoran-ci -p 8501:8501 fintoran:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health; then exit 0; fi
            sleep 2
          done
          docker logs fintoran-ci
          exit 1
      - name: Container smoke test
        if: always()
        run: |
          docker ps -a
          docker logs fintoran-ci || true
          docker inspect --format='{{json .State.Health}}' fintoran-ci || true
      - name: Stop container
        if: always()
        run: docker rm -f fintoran-ci || true
